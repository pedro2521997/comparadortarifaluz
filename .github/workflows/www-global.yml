# Publica la redirección de www.powerpricenow.com. Va aparte del build diario porque casi nunca cambia.
name: Redirección www de la web global

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/worker-global-www/**
      - .github/workflows/www-global.yml

permissions:
  contents: read

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx wrangler deploy
        working-directory: apps/worker-global-www
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
